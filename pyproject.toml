[project]
name = "amp-challenge"
version = "0.1.0"
description = "Oracle-first, reproducible AMP Challenge 2027 pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Jaemin Sim" },
]
dependencies = [
    "levenshtein>=0.27.3,<0.28",
    "openpyxl>=3.1.5,<4",
]

[project.optional-dependencies]
train = [
    "safetensors>=0.5,<0.7",
    "scikit-learn>=1.7,<1.9",
    "torch>=2.8,<2.10",
    "transformers>=4.56,<5",
]

[project.scripts]
amp = "amp_challenge.cli:main"
generate = "amp_challenge.cli:generate_entrypoint"
generate_broad_spectrum = "amp_challenge.cli:generate_entrypoint"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
