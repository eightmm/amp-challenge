name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run generate_broad_spectrum --n-sequences 300 --top-k 10
      - run: >-
          uv run amp validate
          --run-dir generate_broad_spectrum
          --expected-library-size 300
          --expected-top-size 10
